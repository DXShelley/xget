#:schema node_modules/wrangler/config-schema.json
name = "xget-fast"
main = "src/index.js"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [
  { pattern = "fast.dxshelley.fun", custom_domain = true },
  # Includes docker.fast.dxshelley.fun, the Docker Hub Registry API mirror.
  { pattern = "*.fast.dxshelley.fun/*", zone_name = "dxshelley.fun" }
]

[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "QUOTA_GATE"
class_name = "QuotaGate"
script_name = "quota-gateway"

[vars]
XGET_AUTH_REQUIRED = "true"
XGET_PROXY_TARGET_ALLOWLIST = "false"
QUOTA_GATE_NAME = "account-free-20260824"
QUOTA_PROFILE = "account"
QUOTA_ENFORCEMENT_MODE = "hourly"

[[durable_objects.bindings]]
name = "PAGE_MAP"
class_name = "PageMap"

[[migrations]]
tag = "v1-auto-page-map"
new_sqlite_classes = ["PageMap"]

[env.git]
name = "xget-git"
workers_dev = false
routes = [{ pattern = "git.dxshelley.fun", custom_domain = true }]

[[env.git.durable_objects.bindings]]
name = "QUOTA_GATE"
class_name = "QuotaGate"
script_name = "quota-gateway"

[env.git.vars]
XGET_AUTH_REQUIRED = "true"
XGET_PROXY_TARGET_ALLOWLIST = "true"
GITHUB_WEB_HOST = "git.dxshelley.fun"
QUOTA_GATE_NAME = "account-free-20260824"
QUOTA_PROFILE = "account"
QUOTA_ENFORCEMENT_MODE = "hourly"
